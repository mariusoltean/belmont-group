services:
  belmont-group:
    build:
      context: .
      dockerfile: Dockerfile
    image: belmont-group:latest
    container_name: belmont-group
    restart: unless-stopped
    ports:
      # host:container - cop-gateway reverse-proxies to host.docker.internal:9095
      - "9095:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
