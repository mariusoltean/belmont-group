<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belmont Group</title>
<meta name="description" content="Belmont Group — site în construcție.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #ffffff;
    --bg-accent: #f4f6f8;
    --fg: #16202a;
    --fg-muted: #5b6b7a;
    --rule: #dfe5ea;
    --brand: #1f4e79;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419;
      --bg-accent: #161d24;
      --fg: #e8edf2;
      --fg-muted: #9aa8b5;
      --rule: #263039;
      --brand: #7fb3e0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419;
    --bg-accent: #161d24;
    --fg: #e8edf2;
    --fg-muted: #9aa8b5;
    --rule: #263039;
    --brand: #7fb3e0;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 14px;
    background: var(--bg-accent);
    border: 1px solid var(--rule);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 1.35rem;
    letter-spacing: 0.02em;
    color: var(--brand);
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  .lead {
    margin: 0 auto;
    max-width: 38ch;
    color: var(--fg-muted);
    font-size: 1.0625rem;
    line-height: 1.6;
  }

  .rule {
    width: 48px;
    height: 1px;
    margin: 32px auto;
    background: var(--rule);
    border: 0;
  }

  .note {
    margin: 0;
    color: var(--fg-muted);
    font-size: 0.9375rem;
    line-height: 1.6;
  }

  footer {
    flex: 0 0 auto;
    padding: 24px 16px;
    text-align: center;
    color: var(--fg-muted);
    font-size: 0.8125rem;
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>
  <main>
    <div class="card">
      <div class="mark" aria-hidden="true">BG</div>
      <h1>Belmont Group</h1>
      <p class="lead">Site&nbsp;ul nostru este în construcție. Revenim în curând.</p>
      <hr class="rule">
      <p class="note">Our website is under construction and will be available soon.</p>
    </div>
  </main>
  <footer>
    &copy; <span id="y">2026</span> Belmont Group
  </footer>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
