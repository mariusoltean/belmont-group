<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Belmont Group — Galerie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section id="gallery" data-component="app-gallery" style="font-family: Figtree, system-ui, sans-serif; color: #1C231C; background: #FBF8F1; border-top: 1px solid rgba(28, 35, 28, 0.14); padding: clamp(52px, 5vw, 72px) clamp(20px, 5vw, 40px); scroll-margin-top: 100px">
<div style="opacity: {{reveal.o}}; transform: translateY({{reveal.y}}); transition: opacity 0.8s ease, transform 0.8s ease; max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(32px, 4vw, 48px)">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #8A5F2B">{{t.kicker}}</p>
<h2 style="margin: 0; max-width: 820px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(34px, 4.2vw, 58px); line-height: 1.04; letter-spacing: -0.01em; color: #24382A; text-wrap: balance">{{t.title}}</h2>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px">
<sc-for list="{{photos}}" as="photo" hint-placeholder-count="8">
<li style="display: flex">
<button type="button" onClick="{{photo.open}}" onMouseEnter="{{photo.enter}}" onMouseLeave="{{leave}}" onFocus="{{photo.enter}}" onBlur="{{leave}}" aria-label="{{photo.openLabel}}" style="display: block; width: 100%; padding: 0; border: 0; overflow: hidden; background: #E9EBDF; cursor: zoom-in">
<img src="{{photo.src}}" alt="" loading="lazy" style="display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; transform: scale({{photo.scale}}); transition: transform 0.6s ease">
</button>
</li>
</sc-for>
</ul>
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<p role="status" style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: #566052">{{countLabel}}</p>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{loadMore}}" style="display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 28px; border: 1px solid #24382A; border-radius: 2px; background: transparent; color: #24382A; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">
{{t.loadMore}}
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v10M2.5 7.5L7 12l4.5-4.5"></path></svg>
</button>
</sc-if>
</div>
</div>
<sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="{{current.alt}}" style="position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 72px 16px 24px; box-sizing: border-box; background: rgba(20, 29, 21, 0.94)">
<button type="button" onClick="{{close}}" aria-label="{{t.close}}" style="position: absolute; top: 16px; right: 16px; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 1px solid rgba(246, 241, 230, 0.4); border-radius: 50%; background: transparent; color: #F6F1E6; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"></path></svg>
</button>
<img src="{{current.src}}" alt="{{current.alt}}" style="display: block; max-width: min(1100px, 100%); max-height: calc(100vh - 220px); object-fit: contain">
<div style="display: flex; align-items: center; gap: 20px">
<button type="button" onClick="{{prev}}" aria-label="{{t.prev}}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 1px solid rgba(246, 241, 230, 0.4); border-radius: 50%; background: transparent; color: #F6F1E6; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"></path></svg>
</button>
<p style="margin: 0; min-width: 220px; text-align: center; font-size: 15px; line-height: 1.5; color: #F6F1E6">{{current.alt}} <span style="color: #D9B47A">· {{current.count}}</span></p>
<button type="button" onClick="{{next}}" aria-label="{{t.next}}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 0; border: 1px solid rgba(246, 241, 230, 0.4); border-radius: 50%; background: transparent; color: #F6F1E6; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l6 6-6 6"></path></svg>
</button>
</div>
</div>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["ro","en"],"default":"ro","section":"Language"},"initialCount":{"editor":"int","min":4,"max":16,"step":4,"default":8,"section":"Load more"},"pageSize":{"editor":"int","min":1,"max":8,"step":1,"default":4,"section":"Load more"},"$preview":{"width":1440,"height":880}}'>
class Component extends DCLogic {
state = { open: -1, shown: 0, hover: -1, hidden: false };
componentDidMount() {
if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
const el = document.querySelector('[data-component="app-gallery"]');
if (!el || el.getBoundingClientRect().top < window.innerHeight * 0.9) return;
this.setState({ hidden: true });
this.io = new IntersectionObserver((entries) => {
if (entries.some((e) => e.isIntersecting)) {
this.setState({ hidden: false });
this.io.disconnect();
}
}, { threshold: 0.1 });
this.io.observe(el);
}
componentWillUnmount() {
if (this.io) this.io.disconnect();
}
reveal() {
return (this.state && this.state.hidden) ? { o: '0', y: '28px' } : { o: '1', y: '0px' };
}
sources() {
return [
'assets/images/photo-01.jpg',
'assets/images/photo-03.jpg',
'assets/images/photo-02.jpg',
'assets/images/photo-04.jpg',
'assets/images/photo-05.jpg',
'assets/images/photo-06.jpg',
'assets/images/photo-07.jpg',
'assets/images/photo-08.jpg',
'assets/images/photo-09.jpg',
'assets/images/photo-10.jpg',
'assets/images/photo-11.jpg',
'assets/images/photo-12.jpg',
'assets/images/photo-13.jpg',
'assets/images/photo-14.jpg',
'assets/images/photo-15.jpg',
'assets/images/photo-16.jpg'
];
}
i18n() {
return {
ro: {
kicker: 'Galerie',
title: 'Belmont Angus pe pășunile ecologice ale Transilvaniei.',
open: 'Mărește fotografia',
close: 'Închide',
prev: 'Fotografia anterioară',
next: 'Fotografia următoare',
loadMore: 'Încarcă mai multe fotografii',
countOf: 'din',
countUnit: 'fotografii',
photos: [
'Cireada Belmont Angus',
'Două bovine pe pășune',
'Black Angus la păscut',
'Pășune cu cireada în depărtare',
'Pășune sub cer de vară',
'Vedere spre lac și munți',
'Dealuri și pășuni',
'Iarbă înaltă pe deal',
'Taur și vacă Angus',
'Coline verzi',
'Valea văzută de pe deal',
'Fâneață în lumina verii',
'Cireada la umbra unui copac',
'Cireada la odihnă, cu munții în zare',
'Vacă Angus cu vițel',
'Cireada pe zăpadă'
]
},
en: {
kicker: 'Gallery',
title: 'Belmont Angus on organic Transylvanian pastures.',
open: 'Enlarge photo',
close: 'Close',
prev: 'Previous photo',
next: 'Next photo',
loadMore: 'Load more photos',
countOf: 'of',
countUnit: 'photos',
photos: [
'Belmont Angus herd',
'Two cattle on pasture',
'Black Angus grazing',
'Pasture with the herd in the distance',
'Pasture under a summer sky',
'View towards the lake and mountains',
'Hills and pastures',
'Tall grass on the hillside',
'Angus bull and cow',
'Green hills',
'The valley seen from the hill',
'Hay meadow in summer light',
'The herd in the shade of a tree',
'The herd at rest, mountains beyond',
'Angus cow with calf',
'The herd in the snow'
]
}
};
}
renderVals() {
const all = this.i18n();
const t = all[this.props.locale] || all.ro;
const src = this.sources();
const n = src.length;
const s = this.state || {};
const initial = Math.max(1, Math.min(n, Number(this.props.initialCount) || 8));
const page = Math.max(1, Number(this.props.pageSize) || 4);
const shown = Math.min(n, Math.max(initial, s.shown || 0));
const open = typeof s.open === 'number' ? s.open : -1;
const isOpen = open >= 0 && open < shown;
const at = isOpen ? open : 0;
const hover = typeof s.hover === 'number' ? s.hover : -1;
return {
t: t,
reveal: this.reveal(),
photos: src.slice(0, shown).map((url, i) => ({
src: url,
openLabel: t.open + ': ' + t.photos[i],
scale: i === hover ? '1.06' : '1',
open: () => this.setState({ open: i }),
enter: () => this.setState({ hover: i })
})),
leave: () => this.setState({ hover: -1 }),
hasMore: shown < n,
countLabel: shown + ' ' + t.countOf + ' ' + n + ' ' + t.countUnit,
loadMore: () => this.setState({ shown: Math.min(n, shown + page) }),
isOpen: isOpen,
current: { src: src[at], alt: t.photos[at], count: (at + 1) + ' / ' + shown },
close: () => this.setState({ open: -1 }),
prev: () => this.setState({ open: (at - 1 + shown) % shown }),
next: () => this.setState({ open: (at + 1) % shown })
};
}
}
</script>
</body>
</html>
