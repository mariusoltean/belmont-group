<script type="text/x-dc" data-dc-script data-props='{"defaultLocale":{"editor":"enum","options":["ro","en"],"default":"ro","section":"Language"},"$preview":{"width":1440,"height":8000}}'>
class Component extends DCLogic {
state = { locale: null };
componentDidUpdate() {
const l = (this.state && this.state.locale) || this.props.defaultLocale || 'ro';
if (typeof document !== 'undefined') document.documentElement.lang = l;
}
renderVals() {
const locale = (this.state && this.state.locale) || this.props.defaultLocale || 'ro';
return {
locale: locale,
setLocale: (l) => this.setState({ locale: l })
};
}
}
</script>
