<section id="philosophy" class="section on-dark">
  <div class="inner" appReveal>
    <figure class="quote">
      <svg aria-hidden="true" width="56" height="2" viewBox="0 0 56 2"><rect width="56" height="2" fill="#D9B47A"></rect></svg>
      <blockquote>{{ 'philosophy.quote' | t }}</blockquote>
    </figure>
    <div class="col">
      <p class="kicker">{{ 'philosophy.kicker' | t }}</p>
      <h2 class="title">{{ 'philosophy.title' | t }}</h2>
      <p class="body">{{ 'philosophy.p1' | t }}</p>
      <p class="body">{{ 'philosophy.p2' | t }}</p>
      <p class="body">{{ 'philosophy.p3' | t }}</p>
    </div>
  </div>
</section>
