<header class="header" [class.is-compact]="scroll.compact()" [class.menu-open]="menuOpen()">
  <div class="row">
    <a class="brand" href="#home" (click)="closeMenu()" [attr.aria-label]="'header.home' | t">
      <img
        class="logo"
        src="images/logo-240.png"
        alt="Belmont Group Angus Farms — Certified organic pastures, Transylvania"
        width="328"
        height="240"
        fetchpriority="high"
      />
    </a>
    <nav id="site-nav" class="nav" [class.is-open]="menuOpen()" [attr.aria-label]="'header.navLabel' | t">
      @for (link of links(); track link.id) {
        <a
          class="nav-link"
          [class.is-current]="link.current"
          [href]="link.href"
          [attr.aria-current]="link.current ? 'true' : 'false'"
          (click)="closeMenu()"
          >{{ link.labelKey | t }}</a
        >
      }
      <!-- Mobile menu only: the row's Contact button is hidden there. -->
      <a class="nav-cta" href="#contact" (click)="closeMenu()">{{ 'header.cta' | t }}</a>
    </nav>
    <div class="controls">
      <div class="lang" role="group" [attr.aria-label]="'header.langLabel' | t">
        @for (loc of locales; track loc.code) {
          <button
            type="button"
            class="lang-btn"
            [class.is-active]="loc.code === i18n.locale()"
            [attr.aria-pressed]="loc.code === i18n.locale() ? 'true' : 'false'"
            [attr.aria-label]="loc.name"
            [attr.lang]="loc.code"
            (click)="pick(loc.code)"
          >
            {{ loc.label }}
          </button>
        }
      </div>
      <a class="cta" href="#contact">{{ 'header.cta' | t }}</a>
      <button
        type="button"
        class="menu-btn"
        aria-controls="site-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="(menuOpen() ? 'header.menuClose' : 'header.menuOpen') | t"
        (click)="toggleMenu()"
      >
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          @if (menuOpen()) {
            <path d="M5 5l12 12M17 5L5 17"></path>
          } @else {
            <path d="M3 6h16M3 11h16M3 16h16"></path>
          }
        </svg>
      </button>
    </div>
  </div>
  <div
    class="progress"
    role="progressbar"
    [attr.aria-label]="'header.progressLabel' | t"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="progressNow()"
  >
    <div class="progress-fill" [style.width.%]="scroll.progress()"></div>
  </div>
</header>
