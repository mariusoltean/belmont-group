server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the entry document - lets new deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Content-hashed build output (main-XXXX.js, styles-XXXX.css, media/ fonts)
    location ~* \.(?:css|js|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images and icons keep stable names, so cache for a month rather than forever
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Translations, sitemap, robots, manifest: always revalidate
    location ~* \.(?:json|xml|txt|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single page: unknown paths fall back to the prerendered index
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # The public gateway adds HSTS; these are the per-site basics.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
